[basic]
ProductRulePath = ../data/mod_ai_rate_limit/ai_rate_limit.data

[redis]
# bns addr
bns = BLB.ALB-redis
# redis 集群模式: proxy (default), official
#ClusterMode =

# timeout in ms
connectTimeout = 20
readTimeout = 20
writeTimeout = 20

# max idle connections
maxIdle = 20

[log]
OpenDebug = true


