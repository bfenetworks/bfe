[basic]
ProductRulePath = ../conf/mod_ai_cache/mod_ai_cache_rule.data
CacheKeyPrefix = ai_cache
DefaultCacheTTL = 3600

[redis]
bns = BFE.poc-redis-wx
connectTimeout = 20
readTimeout = 20
writeTimeout = 20
maxIdle = 20

[embedding]
serviceHost = 127.0.0.1
servicePort = 11434
useHttps = false
apiKey =
model = nomic-embed-text
timeoutMs = 500

[vector]
type = chroma
serviceHost = 127.0.0.1
servicePort = 8000
apiKey =
collection = ai_cache_semantic
timeoutMs = 300
maxQuestionBytes = 4096

[log]
OpenDebug = false
