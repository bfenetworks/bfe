[basic]
# path for product rule
ProductRulePath = ../conf/mod_traffic_mirror/mirror_rule.data

# layered timeouts for mirror sub-requests (FR-9)
ConnectTimeoutMs = 2000
TTFBTimeoutMs = 30000
TotalTimeoutMs = 600000

# request body mirror limit, must not exceed the accessible body buffer
# (8MB); requests above the limit are skipped and counted
MaxMirrorBodyBytes = 2097152

# max bytes to drain from one mirror response; beyond the limit the response
# is truncated, discarded and counted
MaxResponseBodyBytes = 16777216

# module level concurrency control: MaxConcurrent workers drain a bounded
# submit queue; tasks arriving while the queue is full are dropped and counted
MaxConcurrent = 1024
QueueCapacity = 4096

# circuit breaker per mirror target: after threshold consecutive failures the
# target is dropped for the cooldown window
CircuitBreakerFailThreshold = 50
CircuitBreakerCooldownSec = 30

[log]
OpenDebug = false
