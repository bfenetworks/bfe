[basic]
# DecisionServiceAddr: address of the decision service (System One protocol)
DecisionServiceAddr = http://127.0.0.1:8000
# QuestionsPath: path for intent questions data file (hot reloadable)
QuestionsPath = mod_ai_intent/intent_questions.data
# TimeoutMs: per classification timeout (ms); raise to 2000 for local CPU backends
TimeoutMs = 300
# MaxStateChars: rune truncation length of the classified text
MaxStateChars = 2000
# CacheSize: max entries of in-process LRU cache
CacheSize = 10000
# CacheTTLSeconds: TTL of cache entries (s)
CacheTTLSeconds = 1800
# ExplicitIntentHeader: request header for explicit intent declaration
ExplicitIntentHeader = X-AI-Intent

[breaker]
# FailureThreshold: consecutive failures before the breaker opens
FailureThreshold = 5
# ProbeIntervalMs: probe interval while the breaker is open (ms)
ProbeIntervalMs = 5000

[log]
OpenDebug = false
