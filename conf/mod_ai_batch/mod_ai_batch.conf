[basic]
# mod_ai_batch.data: hot-reloadable knobs (global hard ceilings, reserve
# estimation defaults, parse caps, ownership policy). This .conf file is
# loaded once at Init; tunables take effect via the .data reload.
ProductRulePath = ../conf/mod_ai_batch/mod_ai_batch.data

# Redis for BATCH_* state keys. Use the same Redis cluster as [AIKeyAffinity]
# and the quota keys. Empty Bns disables batch state and batch affinity
# (fail-open: passthrough continues, counters record the misses).
[redis]
Bns = 127.0.0.1:6379
ConnectTimeout = 50
ReadTimeout = 50
WriteTimeout = 50
MaxIdle = 10
MaxActive = 20
Password =

[log]
OpenDebug = false
