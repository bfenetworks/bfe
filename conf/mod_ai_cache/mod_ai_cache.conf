[basic]
ProductRulePath = ../conf/mod_ai_cache/mod_ai_cache_rule.data
CacheKeyPrefix = ai_cache
DefaultCacheTTL = 3600

[redis]
# bns addr
#bns = BLB.ALB-redis
bns = BFE.poc-redis-wx

# timeout in ms
connectTimeout = 20
readTimeout = 20
writeTimeout = 20

# max idle connections
maxIdle = 20

# semantic cache (optional): the two sections below enable the semantic
# (vector similarity) cache on top of the exact-match redis cache. Both
# sections are required for the semantic cache; when absent (or when the
# services are unreachable at startup) the module degrades to the pure
# exact-match cache with a warning, never failing to start.
[embedding]
# OpenAI compatible embedding service (Ollama 11434, OpenAI 443 + useHttps)
serviceHost = 127.0.0.1
servicePort = 11434
useHttps = false
# bearer credential, leave empty for unauthenticated services; never logged
apiKey =
model = nomic-embed-text
# per-call timeout (ms), embedding failure degrades the request to a miss
timeoutMs = 500

[vector]
# vector store type, only chroma for now
type = chroma
serviceHost = 127.0.0.1
servicePort = 8000
apiKey =
collection = ai_cache_semantic
# per-call timeout (ms)
timeoutMs = 300
# questions longer than this skip the semantic lookup (exact cache unaffected)
maxQuestionBytes = 4096

[log]
OpenDebug = false
