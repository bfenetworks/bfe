[basic]
# DecisionServiceAddr is rewritten at test runtime with the mock decision
# service address (see BFEConfigBuilder.DecisionServiceAddr).
DecisionServiceAddr = http://127.0.0.1:18090
QuestionsPath = mod_ai_intent/intent_questions.data
TimeoutMs = 2000
MaxStateChars = 2000
CacheSize = 10000
CacheTTLSeconds = 1800
ExplicitIntentHeader = X-AI-Intent

[breaker]
FailureThreshold = 2
ProbeIntervalMs = 60000

[log]
OpenDebug = true
