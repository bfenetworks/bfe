[basic]
ProductRulePath = mod_ai_cache/mod_ai_cache_rule.data
CacheKeyPrefix = ai_cache
DefaultCacheTTL = 3600

[redis]
Bns = 127.0.0.1:6379
ConnectTimeout = 1000
ReadTimeout = 1000
WriteTimeout = 1000
MaxIdle = 10
MaxActive = 20

# semantic cache: the serviceHost/servicePort lines below are rewritten at
# test runtime with the mock embedding / chroma addresses (see
# BFEConfigBuilder.EmbeddingServiceAddr / VectorServiceAddr).
[embedding]
ServiceHost = 127.0.0.1
ServicePort = 1
UseHttps = false
ApiKey =
Model = mock-embedding
TimeoutMs = 1000

[vector]
Type = chroma
ServiceHost = 127.0.0.1
ServicePort = 1
ApiKey =
Collection = ai_cache_semantic
TimeoutMs = 1000
MaxQuestionBytes = 4096

[log]
OpenDebug = true
