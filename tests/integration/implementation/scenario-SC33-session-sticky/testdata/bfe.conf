[server]
httpPort = 18080
httpsPort = 18443
monitorPort = 18081
httpAddr = "127.0.0.1"
httpsAddr = "127.0.0.1"
monitorAddr = "127.0.0.1"
MonitorEnabled = true
maxCpus = 1

TlsHandshakeTimeout = 30
ClientReadTimeout = 5
ClientWriteTimeout = 5
KeepAliveEnabled = true
GracefulShutdownTimeout = 10

EnableAiGateway = false

accessibleBodySize = 4194304
totalBodyBufferSize = 0

Modules = mod_session_sticky

hostRuleConf = server_data_conf/host_rule.data
routeRuleConf = server_data_conf/route_rule.data
vipRuleConf = server_data_conf/vip_rule.data

clusterTableConf = cluster_conf/cluster_table.data
gslbConf = cluster_conf/gslb.data
clusterConf = cluster_conf/cluster_conf.data
NameConf =

maxHeaderUriBytes = 8096
maxHeaderBytes = 8096