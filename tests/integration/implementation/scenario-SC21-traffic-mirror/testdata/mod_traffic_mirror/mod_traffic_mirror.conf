[basic]
# path for product rule; the test overwrites mirror_rule.data before startup
# (and exercises hot reload in TC-14)
ProductRulePath = mod_traffic_mirror/mirror_rule.data

# layered timeouts for mirror sub-requests
ConnectTimeoutMs = 2000
TTFBTimeoutMs = 30000
TotalTimeoutMs = 600000

# request body mirror limit
MaxMirrorBodyBytes = 2097152

# max bytes to drain from one mirror response (TC-11 rewrites this to 65536)
MaxResponseBodyBytes = 16777216

# module level concurrency control
MaxConcurrent = 1024
QueueCapacity = 4096

# circuit breaker per mirror target (TC-10 rewrites these to 3 / 2)
CircuitBreakerFailThreshold = 50
CircuitBreakerCooldownSec = 30

[log]
OpenDebug = false
